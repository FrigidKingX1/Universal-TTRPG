[package]
name = "auto-dm-core"
version = "0.1.0"
description = "Pure logic crate for the Universal Auto-DM engine: models, dice math, Mythic oracle, combat engine"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"
async-trait = "0.1"
# ZMQ transport to A.L.I.S.O.N.'s control socket. `zmq-sys` (pulled in by
# `zmq`) builds libzmq statically from bundled source, so no external
# libzmq.dll is required at runtime.
zmq = "0.10"
