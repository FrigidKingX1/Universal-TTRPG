[package]
name = "auto-dm-core"
version = "0.1.0"
description = "Pure logic crate for the Universal Auto-DM engine: models, dice math, Mythic oracle, combat engine"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"
async-trait = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
