<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="d20face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ddbe86"/>
      <stop offset="100%" stop-color="#8a6b2e"/>
    </linearGradient>
    <linearGradient id="d20edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e2418"/>
      <stop offset="100%" stop-color="#120e14"/>
