[package]
name = "auto-dm-engine"
version = "0.1.0"
description = "Authoritative game-state engine: SQLite persistence, session effects, combat parsing. No UI dependency."
edition = "2021"

[dependencies]
auto-dm-core = { path = "../core" }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
thiserror = "2"
log = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["sync", "rt", "macros", "test-util"] }
