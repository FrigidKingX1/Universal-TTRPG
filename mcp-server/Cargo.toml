[package]
name = "auto-dm-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
auto-dm-core = { path = "../core" }
auto-dm-engine = { path = "../engine" }
auto-dm-server = { path = "../server" }
rmcp = { version = "3", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }